<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>熱炒小廚房｜炒菜模擬</title>
<meta name="description" content="看顏色、聽聲音，自己判斷火候。挑戰我的分數。">
<meta property="og:title" content="熱炒小廚房｜炒菜模擬">
<meta property="og:description" content="看顏色、聽聲音，自己判斷火候。來挑戰我的分數。">
<meta property="og:image" content="og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1b1410">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#1b1410;color:#f6ead8;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:radial-gradient(120% 60% at 50% 35%,#4a3424 0%,#2a1d15 55%,#17100c 100%);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
/* tiles wall */
.tiles{position:absolute;inset:0 0 auto 0;height:42%;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:34px 34px;pointer-events:none;mask-image:linear-gradient(#000,transparent)}
/* home */
#home{padding:calc(env(safe-area-inset-top) + 18px) 16px 16px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.logo h1{font-size:26px;letter-spacing:2px;background:linear-gradient(#ffe2a8,#ff9a3d);-webkit-background-clip:text;color:transparent}
.sub{opacity:.7;font-size:13px;margin-bottom:14px}
.chal{background:linear-gradient(90deg,#ff7a2f33,#ffc85a22);border:1px solid #ff9a3d66;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{background:linear-gradient(160deg,#3a2a1f,#251a13);border:1px solid #ffffff14;border-radius:18px;padding:10px;text-align:left;box-shadow:0 6px 18px #0006;position:relative}
.rc canvas{width:100%;aspect-ratio:1.35;display:block;border-radius:12px}
.rc b{display:block;font-size:16px;margin-top:4px}
.rc .lv{font-size:12px;opacity:.65}
.rc .best{position:absolute;top:8px;right:10px;font-size:12px;color:#ffd36b}
.howto{margin-top:14px;display:flex;justify-content:space-around;opacity:.85;font-size:12px;text-align:center}
.howto div{display:flex;flex-direction:column;align-items:center;gap:4px}
/* cook */
#cook{padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px 4px}
.ib{width:38px;height:38px;border-radius:12px;background:#ffffff12;display:grid;place-items:center}
.ttl{flex:1;font-size:18px;font-weight:700}
.clock{font-variant-numeric:tabular-nums;font-size:16px;background:#0005;border-radius:10px;padding:6px 10px}
.steps{display:flex;gap:4px;padding:4px 10px 2px;overflow-x:auto;scrollbar-width:none}
.st{flex:0 0 auto;width:44px;height:52px;border-radius:12px;background:#0004;border:1px solid #ffffff14;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:10px;opacity:.9}
.st svg{width:30px;height:30px}
.st i{position:absolute;top:-3px;left:-3px;width:16px;height:16px;border-radius:50%;background:#5c4535;font-style:normal;font-size:10px;display:grid;place-items:center}
.st.ok{border-color:#7ddc6f;background:#7ddc6f22}.st.ok i{background:#4caf50}
.st.bad{border-color:#ff6b5b;background:#ff6b5b22}.st.bad i{background:#e04a3a}
.st.next{border-color:#ffd36b;box-shadow:0 0 0 2px #ffd36b55}
.st.hs svg{width:28px}
#stage{position:relative;flex:1;min-height:0}
#wokc{position:absolute;inset:0;width:100%;height:100%}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#000b;border-radius:12px;padding:6px 12px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}.toast.bad{color:#ffb3a8}.toast.good{color:#bff5b0}
.chips{position:absolute;left:8px;right:8px;bottom:4px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.chip{display:flex;align-items:center;gap:3px;background:#000a;border-radius:10px;padding:2px 6px 2px 2px}
.chip svg{width:20px;height:20px}
.bar{width:34px;height:6px;border-radius:3px;background:linear-gradient(90deg,#9ccf6a 0 45%,#ffcf4a 45% 71%,#ff8a3d 71% 85%,#2a1a12 85%);position:relative}
.bar b{position:absolute;top:-3px;width:3px;height:12px;background:#fff;border-radius:2px;box-shadow:0 0 3px #000}
.ctrl{display:flex;align-items:center;gap:10px;padding:6px 12px}
.heat{display:flex;background:#0006;border-radius:16px;padding:4px;gap:2px;flex:1}
.heat button{flex:1;height:46px;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;opacity:.6}
.heat button.on{background:linear-gradient(#ff8a3d,#d9481e);opacity:1;box-shadow:0 2px 10px #ff6a2a66}
.heat button[data-h="0"].on{background:#556}
.heat svg{height:20px}
.stir{width:86px;height:56px;border-radius:18px;background:linear-gradient(#ffd36b,#f0a024);color:#3a2408;font-weight:800;font-size:15px;box-shadow:0 4px 0 #a86a10,0 6px 14px #0007;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.stir:active{transform:translateY(3px);box-shadow:0 1px 0 #a86a10}
.stir svg{width:26px;height:22px}
.board{margin:4px 10px 6px;border-radius:18px;padding:8px 6px;background:linear-gradient(#c8935a,#a8723f);box-shadow:inset 0 2px 0 #e6b47c,inset 0 -3px 0 #7a4f28,0 6px 14px #0008;position:relative}
.board:before{content:"";position:absolute;inset:0;border-radius:18px;background:repeating-linear-gradient(90deg,#0000 0 23px,#00000010 24px 25px);pointer-events:none}
.tray{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.ing{background:#fff3;border-radius:14px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:#3a2408;font-weight:700;touch-action:none;position:relative;transition:transform .1s}
.ing img{width:46px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 2px #0006);pointer-events:none}
.st img{width:30px;height:30px;object-fit:contain}.chip img{width:20px;height:20px;object-fit:contain}
.ing svg{width:40px;height:40px;filter:drop-shadow(0 2px 2px #0004);pointer-events:none}
.ing.used{opacity:.35}
.ing:active{transform:scale(.93)}
.bottom{display:flex;gap:10px;padding:0 10px calc(env(safe-area-inset-bottom) + 10px)}
.serve{flex:1;height:50px;border-radius:16px;background:linear-gradient(#5fd38a,#2f9e5c);font-size:17px;font-weight:800;box-shadow:0 4px 0 #1f6d3f;display:flex;align-items:center;justify-content:center;gap:8px}
.ghost{position:fixed;width:56px;height:56px;pointer-events:none;z-index:50;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 6px 6px #0008)}
/* result */
#result{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px);overflow-y:auto;align-items:center}
#result h2{font-size:22px;margin-top:2px}
#platec{width:100%;max-width:380px;aspect-ratio:1.5;border-radius:16px;box-shadow:0 8px 24px #0006}
.stars{display:flex;gap:6px;margin:-6px 0 2px}
.stars svg{width:44px;height:44px}
.score{font-size:46px;font-weight:900;line-height:1;background:linear-gradient(#fff2c9,#ffb347);-webkit-background-clip:text;color:transparent}
.vs{font-size:13px;margin:4px 0;color:#ffd36b;min-height:16px}
.tips{width:100%;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.tip{display:flex;gap:10px;align-items:flex-start;background:#0004;border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.45}
.tip svg{flex:0 0 26px;height:26px}
.tip .pt{margin-left:auto;font-weight:700;color:#ff9a8c;white-space:nowrap}
.tip.g .pt{color:#9be58a}
.tip em{font-style:normal;font-weight:700;font-size:12px;padding:1px 6px;border-radius:6px;margin-right:6px;background:#e04a3a;color:#fff}
.tip.safe{border:1px solid #e04a3a}.tip.var em{background:#3d9a4a}.tip.soft em{background:#3a7bd5}.tip.good em{background:#3d9a4a}.tip.k{background:#ffffff14}.tip.k em{background:#c98a1e}
h3.cat{margin:14px 2px 8px;font-size:16px;color:#ffcf8a}
.st.op{opacity:.75;border-style:dashed}
.rbtn{display:flex;gap:10px;width:100%;margin-top:12px}
.rbtn button{flex:1;height:48px;border-radius:14px;font-weight:800;font-size:15px;background:#ffffff18}
.rbtn .pri{background:linear-gradient(#ffd36b,#f0a024);color:#3a2408}
.mute-off{opacity:.5}
</style>
</head>

<div id="app">
 <div class="tiles"></div>

 <!-- COOK -->
 <section id="cook" class="screen">
  <div class="top">
   <button class="ib" id="back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg></button>

   <button class="ib" id="mute" aria-label="靜音"></button>
  </div>
  
  <div id="stage"><canvas id="wokc"></canvas><div class="toast" id="toast"></div></div>
  <div class="ctrl">
   <div class="heat" id="heat">
    <button data-h="0"><svg viewBox="0 0 24 24" width="20"><circle cx="12" cy="12" r="8" stroke="#ccc" stroke-width="2.5" fill="none"/><path d="M12 4v8" stroke="#ccc" stroke-width="2.5"/></svg>關火</button>

    <button data-h="3"><svg viewBox="0 0 48 24"><path d="M10 2q5 8 3 14a3 3 0 0 1-6 0q-1-6 3-14zM24 0q6 9 3 16a3 3 0 0 1-6 0q-1-7 3-16zM38 2q5 8 3 14a3 3 0 0 1-6 0q-1-6 3-14z" fill="#ffd36b"/></svg>大火</button>
   </div>
   <button class="stir" id="stir"><svg viewBox="0 0 40 30"><path d="M4 18a16 10 0 0 0 32 0" stroke="#3a2408" stroke-width="4" fill="none"/><path d="M12 10l8-7 8 7" stroke="#3a2408" stroke-width="4" fill="none" stroke-linecap="round"/></svg>翻炒</button>
  </div>
  <div class="board"><div class="tray" id="tray"></div></div>
  <div class="bottom"><button class="serve" id="serve"><svg width="28" height="20" viewBox="0 0 40 28"><ellipse cx="20" cy="18" rx="18" ry="8" fill="#fff"/><ellipse cx="20" cy="16" rx="10" ry="4" fill="#ffb347"/></svg>起鍋出菜</button></div>
 </section>
 <!-- RESULT -->
 <section id="result" class="screen">
  <h2 id="rname"></h2>
  <canvas id="platec"></canvas>
  <div class="stars" id="stars"></div>
  <div class="score" id="score">0</div>
  <div class="vs" id="vs"></div>
  <div class="tips" id="tips"></div>
  <div class="rbtn"><button id="again">再炒一次</button><button class="pri" id="share">挑戰朋友</button></div>
  <div class="rbtn"><button id="menu">換一道菜</button></div>
 </section>
</div>
